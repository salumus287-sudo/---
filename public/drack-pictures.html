<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>DRACK PICTURES</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{position:fixed;inset:0}
#screen{position:absolute;inset:0;background:#000;overflow:hidden}
#photo{width:100%;height:100%;object-fit:contain;display:block;transition:opacity .7s}
#photo.fade{opacity:0}
#lights{position:absolute;inset:0;border:5px solid transparent;border-image:none;pointer-events:none;z-index:5;box-shadow:inset 0 0 15px #00eaff,0 0 15px #ff00e6;animation:colors 3s linear infinite}
@keyframes colors{0%{border-color:#ff004c;box-shadow:inset 0 0 20px #ff004c,0 0 15px #ff004c}25%{border-color:#00ffff;box-shadow:inset 0 0 20px #00ffff,0 0 15px #00ffff}50%{border-color:#39ff14;box-shadow:inset 0 0 20px #39ff14,0 0 15px #39ff14}75%{border-color:#ff00ff;box-shadow:inset 0 0 20px #ff00ff,0 0 15px #ff00ff}100%{border-color:#ffff00;box-shadow:inset 0 0 20px #ffff00,0 0 15px #ffff00}}
.edge{position:absolute;z-index:7;color:white;font-weight:900;font-size:clamp(12px,3vw,22px);white-space:nowrap;text-shadow:0 0 8px #ff00e6,0 0 15px #00eaff;pointer-events:none;animation:rainbow 2s linear infinite}
#top{top:12px;left:0;animation:runRight 12s linear infinite,rainbow 2s linear infinite}
#bottom{bottom:12px;right:0;animation:runLeft 12s linear infinite,rainbow 2s linear infinite}
#left{left:5px;top:50%;writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg)}
#right{right:5px;top:50%;writing-mode:vertical-rl;transform:translateY(-50%)}
@keyframes runRight{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
@keyframes runLeft{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes rainbow{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
#meteor{position:absolute;left:-100%;top:42%;z-index:8;white-space:nowrap;font-size:clamp(35px,10vw,75px);font-weight:1000;font-style:italic;color:#fff;text-shadow:0 0 10px #fff,0 0 25px #00eaff,0 0 45px #ff00e6;pointer-events:none}
#meteor.fly{animation:fly 4s ease-in-out forwards}
@keyframes fly{0%{left:-90%;top:55%;opacity:0;transform:rotate(-8deg)}15%{opacity:1}55%{top:40%;opacity:1}100%{left:120%;top:25%;opacity:0;transform:rotate(8deg)}}
#message{position:absolute;z-index:8;top:50%;left:50%;width:75%;text-align:center;transform:translate(-50%,-50%) scale(.5);font-size:clamp(18px,5vw,38px);font-weight:1000;color:#fff;text-shadow:0 0 10px #ff00e6,0 0 20px #00eaff;opacity:0;pointer-events:none}
#message.show{animation:pop 4s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
</style>
</head>
<body>
<div id="screen">
<img id="photo" alt="">
<div id="meteor">WELCOME</div>
<div id="message"></div>
<div id="top" class="edge">🎉❤️ ONGERA NA AHSANTE KWA KUTEMBELEA DRACK HUB 🎉❤️</div>
<div id="bottom" class="edge">🌍 KARIBU DRACK HUB • DRACK PICTURES ❤️🎉</div>
<div id="left" class="edge">🎉❤️ KARIBU SANA ❤️🎉</div>
<div id="right" class="edge">🌈 DRACK HUB 🌈</div>
<div id="lights"></div>
</div>
<script>
(()=>{
const photo=document.getElementById('photo');
const meteor=document.getElementById('meteor');
const message=document.getElementById('message');

/* Picha za moja kwa moja kutoka Unsplash */
const photos=[
'https://images.unsplash.com/photo-1500595046743-cd271d694d30?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1521412644187-c49fa049e84d?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1800&q=85',
'https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=1800&q=85'
];

const greetings=[
'🎉❤️ ONGERA NA AHSANTE KWA KUTEMBELEA DRACK HUB ❤️🎉',
'🌍 WELCOME TO DRACK HUB 🌍',
'❤️ KARIBU SANA DRACK PICTURES ❤️',
'✨ DRACK HUB — DUNIA YA PICHA ✨',
'🌈 FURAHA YAKO, DRACK HUB ❤️'
];

let order=[];
let index=0;
let showing=false;
let greetingIndex=0;

function shuffle(){
 order=photos.map((_,i)=>i);
 for(let i=order.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [order[i],order[j]]=[order[j],order[i]];
 }
 index=0;
}

function nextPicture(){
 if(showing)return;
 showing=true;
 if(index>=order.length)shuffle();
 const url=photos[order[index++]];
 const tester=new Image();

 tester.onload=()=>{
  photo.classList.add('fade');
  setTimeout(()=>{
   photo.src=url;
   photo.classList.remove('fade');
   showing=false;
  },350);
 };

 tester.onerror=()=>{
  showing=false;
  if(index<order.length)nextPicture();
  else{
   shuffle();
   nextPicture();
  }
 };
 tester.src=url;
}

function showMeteor(){
 meteor.classList.remove('fly');
 void meteor.offsetWidth;
 meteor.classList.add('fly');
}

function showMessage(){
 message.classList.remove('show');
 message.textContent=greetings[greetingIndex++%greetings.length];
 void message.offsetWidth;
 message.classList.add('show');
}

shuffle();
nextPicture();
setInterval(nextPicture,15000);
setInterval(showMeteor,9000);
setInterval(showMessage,7000);
showMeteor();
showMessage();
})();
</script>
</body>
</html>
