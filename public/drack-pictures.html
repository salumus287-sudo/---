<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>DRACK PICTURES</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
body{position:fixed;inset:0}
#screen{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#photo{display:block;width:100%;height:100%;object-fit:contain;opacity:1;transition:opacity .7s}
#photo.fade{opacity:0}
</style>
</head>
<body>
<div id="screen"><img id="photo" alt=""></div>
<script>
(()=>{
const api='https://commons.wikimedia.org/w/api.php';
const topics=[
'Tanzania Zanzibar landscapes',
'African wildlife animals',
'famous singers musicians',
'famous football players',
'famous places world landmarks',
'delicious food photography',
'luxury cars photography',
'beautiful houses architecture',
'lifestyle photography',
'tropical ocean beaches',
'mountains waterfalls',
'African safari animals',
'beautiful birds photography',
'world famous buildings',
'flowers gardens',
'football teams stadiums',
'sunsets landscapes',
'islands beaches',
'wild horses nature',
'beautiful cities'
];
const photo=document.getElementById('photo');
let pool=[],seen=new Set(),topic=0,current='',busy=false,changing=false;

async function load(){
 if(busy)return;
 busy=true;
 try{
  const p=new URLSearchParams({
   action:'query',format:'json',origin:'*',
   generator:'search',gsrsearch:topics[topic++%topics.length],
   gsrnamespace:'6',gsrlimit:'30',
   prop:'imageinfo',iiprop:'url',iiurlwidth:'1600'
  });
  const r=await fetch(api+'?'+p.toString());
  if(!r.ok)throw Error('Network');
  const d=await r.json();
  for(const item of Object.values(d.query?.pages||{})){
   const url=item.imageinfo?.[0]?.thumburl||item.imageinfo?.[0]?.url;
   if(url&&!seen.has(url)){seen.add(url);pool.push(url)}
  }
 }catch(e){}
 busy=false;
}

async function next(){
 if(changing)return;
 changing=true;
 photo.classList.add('fade');

 let tries=0;
 while(pool.length===0&&tries<3){
  await load();
  tries++;
 }
 if(!pool.length){
  photo.classList.remove('fade');
  changing=false;
  return;
 }

 let index=Math.floor(Math.random()*pool.length);
 let url=pool.splice(index,1)[0];
 if(url===current&&pool.length)url=pool.splice(Math.floor(Math.random()*pool.length),1)[0];

 const test=new Image();
 test.onload=()=>{
  current=url;
  photo.src=url;
  photo.classList.remove('fade');
  changing=false;
 };
 test.onerror=()=>{
  photo.classList.remove('fade');
  changing=false;
  next();
 };
 test.src=url;
}

async function start(){
 await load();
 await next();
 setInterval(next,40000);
 setInterval(()=>{if(pool.length<8)load()},10000);
}
start();
})();
</script>
</body>
</html>
