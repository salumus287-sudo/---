<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>DRACK HUB | Media Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #08120e;
      color: #f4fff8;
      font-family: Arial, sans-serif;
    }
    .box {
      width: 100%;
      max-width: 520px;
      margin: 35px auto;
      padding: 24px;
      background: #11231a;
      border: 1px solid #244c36;
      border-radius: 16px;
    }
    h1 { color: #35e887; margin-top: 0; }
    p { line-height: 1.6; }
    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #3a654b;
      font-size: 16px;
    }
    input, select {
      background: #08120e;
      color: white;
    }
    button {
      margin-top: 16px;
      background: #24d879;
      color: #07130c;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .secondary {
      background: #253b2e;
      color: white;
    }
    .hidden { display: none; }
    #message {
      overflow-wrap: anywhere;
      padding: 10px 0;
    }
    a { color: #53e99a; overflow-wrap: anywhere; }
    small { color: #b7d4c2; }
  </style>
</head>
<body>
  <main class="box">
    <h1>DRACK HUB</h1>
    <p>🔐 Mfumo wa usimamizi wa nyimbo na video.</p>

    <section id="loginSection">
      <h2>Ingia Admin</h2>
      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username"
          autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
          autocomplete="current-password" required>

        <button id="loginBtn" type="submit">INGIA</button>
      </form>
    </section>

    <section id="uploadSection" class="hidden">
      <h2>Pakia Nyimbo au Video</h2>
      <p>Umeingia kikamilifu kwenye akaunti ya admin.</p>

      <label for="mediaType">Aina ya faili</label>
      <select id="mediaType">
        <option value="audio">🎵 Wimbo / Audio</option>
        <option value="video">🎬 Video</option>
      </select>

      <label for="mediaFile">Chagua faili</label>
      <input id="mediaFile" type="file" required>
      <small>Ukubwa wa juu: 100 MB. Ruhusiwa audio na video.</small>

      <button id="uploadBtn" type="button">PAKIA FAILI</button>
      <button id="logoutBtn" class="secondary" type="button">
        TOKA KWENYE AKAUNTI
      </button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
    <div id="result"></div>
    <p><a href="/">Rudi DRACK HUB</a></p>
  </main>

  <script>
    const loginSection = document.getElementById("loginSection");
    const uploadSection = document.getElementById("uploadSection");
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const fileInput = document.getElementById("mediaFile");
    const typeSelect = document.getElementById("mediaType");
    const message = document.getElementById("message");
    const result = document.getElementById("result");

    function showMessage(text) {
      message.textContent = text;
    }

    function showLoggedIn(authenticated) {
      loginSection.classList.toggle("hidden", authenticated);
      uploadSection.classList.toggle("hidden", !authenticated);
      if (!authenticated) result.replaceChildren();
    }

    async function checkSession() {
      try {
        const response = await fetch("/api/admin/session", {
          credentials: "same-origin"
        });
        const data = await response.json();
        showLoggedIn(Boolean(data.authenticated));
      } catch {
        showMessage("Imeshindikana kuangalia login. Jaribu tena.");
      }
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginBtn.disabled = true;
      showMessage("Inakagua taarifa za login...");
      result.replaceChildren();

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          showMessage(data.message || "Login imeshindwa.");
          return;
        }

        document.getElementById("password").value = "";
        showLoggedIn(true);
        showMessage("Umeingia salama. Unaweza kupakia faili.");
      } catch {
        showMessage("Imeshindikana kuwasiliana na server.");
      } finally {
        loginBtn.disabled = false;
      }
    });

    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];

      if (!file) {
        showMessage("Chagua faili kwanza.");
        return;
      }

      if (file.size > 100 * 1024 * 1024) {
        showMessage("Faili limezidi ukubwa wa 100 MB.");
        return;
      }

      if (typeSelect.value === "audio" &&
          !file.type.toLowerCase().startsWith("audio/")) {
        showMessage("Chagua faili la audio.");
        return;
      }

      if (typeSelect.value === "video" &&
          !file.type.toLowerCase().startsWith("video/")) {
        showMessage("Chagua faili la video.");
        return;
      }

      const formData = new FormData();
      formData.append("media", file);

      uploadBtn.disabled = true;
      result.replaceChildren();
      showMessage("Inapakia faili. Subiri...");

      try {
        const response = await fetch("/api/admin/drack-media/upload", {
          method: "POST",
          credentials: "same-origin",
          body: formData
        });

        const data = await response.json();

        if (response.status === 401) {
          showLoggedIn(false);
          showMessage("Login imeisha muda wake. Ingia tena.");
          return;
        }

        if (!response.ok || !data.success) {
          showMessage(data.message || "Upload imeshindwa.");
          return;
        }

        showMessage("SAWA! Faili limepakiwa Cloudinary.");

        const name = document.createElement("p");
        name.textContent = "Jina: " + data.media.name;
        result.appendChild(name);

        const link = document.createElement("a");
        link.href = data.media.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Fungua faili lililopakiwa";
        result.appendChild(link);

        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.textContent = "NAKILI LINK";
        copyBtn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(data.media.url);
            showMessage("Link imenakiliwa.");
          } catch {
            showMessage("Nakili link kwa kuifungua na kuinakili.");
          }
        });
        result.appendChild(copyBtn);

        fileInput.value = "";
      } catch {
        showMessage("Upload imeshindwa kuwasiliana na server.");
      } finally {
        uploadBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      logoutBtn.disabled = true;

      try {
        await fetch("/api/admin/logout", {
          method: "POST",
          credentials: "same-origin"
        });
      } finally {
        showLoggedIn(false);
        showMessage("Umetoka kwenye akaunti.");
        logoutBtn.disabled = false;
      }
    });

    checkSession();
  </script>
</body>
</html>
